<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مشغّل الفيديو</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="wrap">
  <div class="filmstrip">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <header class="top">
    <div class="eyebrow">غرفة العرض</div>
    <h1>الصق رابط الفيديو</h1>
  </header>

  <div id="homeView" class="card">
    <form id="pasteForm">
      <div class="field">
        <label>رابط الفيديو</label>
        <input type="text" id="pasteInput" placeholder="https://upload.mydomain.com/v/abc123xyz" required />
      </div>
      <button class="btn" type="submit">▶ تشغيل</button>
    </form>
  </div>

  <div id="playerView" style="display:none;"></div>

  <footer class="note">جميع الفيديوهات تُخزَّن وتُشغَّل عبر تيليجرام.</footer>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
